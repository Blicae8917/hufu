name: ci

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      gate_mode:
        description: "observe 或 release"
        type: choice
        options:
          - observe
          - release
        default: observe

permissions:
  contents: read

jobs:
  gates:
    name: gates
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm test
        run: pnpm test

      - name: node scripts/check-version.mjs
        run: node scripts/check-version.mjs

      - name: node scripts/check-upstream-drift.mjs --mode=static
        run: node scripts/check-upstream-drift.mjs --mode=static

      - name: git diff --check
        run: |
          git fetch --no-tags origin main
          git diff --check origin/main...HEAD
          git diff --check

  upstream-observe:
    name: upstream-observe
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: node scripts/check-upstream-drift.mjs --mode=observe
        run: node scripts/check-upstream-drift.mjs --mode=${{ github.event.inputs.gate_mode || 'observe' }}
