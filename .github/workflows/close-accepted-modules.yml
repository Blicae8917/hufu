name: close-accepted-modules

# Temporary helper so the Cloud Agent can close Module Issues that the
# sandbox GitHub token cannot write. Do not merge this workflow to main.
on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: close-28
    if: github.event.pull_request.head.ref == 'cursor/close-accepted-issues-b880'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close accepted Issue #28
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          close_if_open() {
            local number="$1"
            local comment_file="$2"
            local state
            state="$(gh issue view "${number}" --repo "${repo}" --json state --jq .state)"
            if [ "${state}" = "CLOSED" ]; then
              echo "#${number} already closed"
              return 0
            fi
            gh issue close "${number}" --repo "${repo}" --reason completed --comment "$(cat "${comment_file}")"
            echo "closed #${number}"
          }

          cat > /tmp/close-28.md <<'EOF'
          ## 验收关闭

          按本 Issue 的必须交付与明确不做核对，**可以关闭**。合入证据：[PR #34](https://github.com/Blicae8917/hufu/pull/34)（已合并入 `main`，merge `4dbf139`）。

          - `github-http` 列表 URL 使用 `CANONICAL_OWNER` / `CANONICAL_REPO`
          - GitHub / GitLab 只读 GET 固定 10 秒超时；超时 → `OBSERVATION_UNAVAILABLE`，保留旧观测，`freshness=stale`
          - README 六个有界命令；`HUFU_DENY_NETWORK=1` 已文档化
          - `.gitignore` 去掉已退役 Python 条目

          未改 `main.ts` 退出码，未新增 `--help`，未加 GitHub 认证。

          路线图索引 [#5](https://github.com/Blicae8917/hufu/issues/5) 保持 OPEN。
          EOF

          close_if_open 28 /tmp/close-28.md

          gh issue view 28 --repo "${repo}" --json number,state,title
          gh issue view 5 --repo "${repo}" --json number,state,title
