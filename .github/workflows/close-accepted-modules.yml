name: close-accepted-modules

# Temporary helper so the Cloud Agent can close Module Issues that the
# sandbox GitHub token cannot write. Do not merge this workflow to main.
on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: close-8
    if: github.event.pull_request.head.ref == 'cursor/close-accepted-issues-b880'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close accepted Module Issue #8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          close_if_open() {
            local number="$1"
            local comment_file="$2"
            local state
            state="$(gh issue view "${number}" --repo "${repo}" --json state --jq .state)"
            if [ "${state}" = "CLOSED" ]; then
              echo "#${number} already closed"
              return 0
            fi
            gh issue close "${number}" --repo "${repo}" --reason completed --comment "$(cat "${comment_file}")"
            echo "closed #${number}"
          }

          cat > /tmp/close-8.md <<'EOF'
          ## 验收关闭

          按本 Issue 的必须交付与明确不做核对，**可以关闭**。合入证据：[PR #17](https://github.com/Blicae8917/hufu/pull/17)（已合并入 `main`，merge `24cc5c8`）。功能合同：`specs/007-gitlab-readonly/`。

          必须交付均已有失败先写、后合入的测试覆盖：

          - GitLab 只读投影带原始链接、来源身份、观测时间与时效：`tests/gitlab-status.test.ts`
          - 适配器只读（GET、无 token、丢弃 MR、不拷贝 description、失败保留旧缓存）：`tests/gitlab-adapter.test.ts`
          - `external_ref` 使用 `gitlab:group/project#iid`，无法判定则拒绝：`tests/gitlab-ref.test.ts`
          - 连接手填两段 `group/project`，拒绝嵌套组、GitHub 网址与已有正本冲突：`tests/gitlab-connect.test.ts`
          - 交接与裁决只引用缓存中的 GitLab 议题，不写回：`tests/gitlab-handoff.test.ts`、`tests/gitlab-decide.test.ts`

          明确不做均保持：不写回议题、不把 GitLab 状态复制成本地第二套生命周期、不引入后台刷新。

          本关闭不等于 `0.1.0` 已发布。路线图索引 [#5](https://github.com/Blicae8917/hufu/issues/5) 保持 OPEN。
          EOF

          close_if_open 8 /tmp/close-8.md

          gh issue view 8 --repo "${repo}" --json number,state,title
          gh issue view 5 --repo "${repo}" --json number,state,title
