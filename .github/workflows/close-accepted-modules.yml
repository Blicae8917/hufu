name: close-accepted-modules

# Temporary helper so the Cloud Agent can close Module Issues that the
# sandbox GitHub token cannot write. Do not merge this workflow to main.
on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: close-25
    if: github.event.pull_request.head.ref == 'cursor/close-accepted-issues-b880'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close accepted Issue #25
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          close_if_open() {
            local number="$1"
            local comment_file="$2"
            local state
            state="$(gh issue view "${number}" --repo "${repo}" --json state --jq .state)"
            if [ "${state}" = "CLOSED" ]; then
              echo "#${number} already closed"
              return 0
            fi
            gh issue close "${number}" --repo "${repo}" --reason completed --comment "$(cat "${comment_file}")"
            echo "closed #${number}"
          }

          cat > /tmp/close-25.md <<'EOF'
          ## 验收关闭

          按本 Issue 的必须交付与明确不做核对，**可以关闭**。合入证据：[PR #32](https://github.com/Blicae8917/hufu/pull/32)（已合并入 `main`，merge `64a197d`）。

          - 删除「2026-08-16 提交未变」假观测，写明当日 master 在 `5bb600f`
          - 已核对基线保持 `47f9438` / rc.5；补 rc.7 与 2026-08-22 HEAD 观测
          - LoopX 补漂移量并标明 HEAD 当日失效
          - 8 条安装契约在 rc.7 下仍成立；Host 表补 DSH 自带能力与重合面
          - 计数在完整历史上取得，并给出可复现命令

          未提升已接受基线，未修改 `packages/hufu-dsh`，未裁决 LoopX 定位。

          路线图索引 [#5](https://github.com/Blicae8917/hufu/issues/5) 保持 OPEN。
          EOF

          close_if_open 25 /tmp/close-25.md

          gh issue view 25 --repo "${repo}" --json number,state,title
          gh issue view 5 --repo "${repo}" --json number,state,title
