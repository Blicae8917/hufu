name: close-accepted-modules

# Temporary helper so the Cloud Agent can close Module Issues that the
# sandbox GitHub token cannot write. Do not merge this workflow to main.
on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: close-27
    if: github.event.pull_request.head.ref == 'cursor/close-accepted-issues-b880'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close accepted Issue #27
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          close_if_open() {
            local number="$1"
            local comment_file="$2"
            local state
            state="$(gh issue view "${number}" --repo "${repo}" --json state --jq .state)"
            if [ "${state}" = "CLOSED" ]; then
              echo "#${number} already closed"
              return 0
            fi
            gh issue close "${number}" --repo "${repo}" --reason completed --comment "$(cat "${comment_file}")"
            echo "closed #${number}"
          }

          cat > /tmp/close-27.md <<'EOF'
          ## 验收关闭

          按本 Issue 的必须交付与明确不做核对，**可以关闭**。合入证据：[PR #36](https://github.com/Blicae8917/hufu/pull/36)（已合并入 `main`，merge `1018be8`）。功能合同：`specs/010-upstream-drift/`。

          - `scripts/check-upstream-drift.mjs` 解析门禁核对表并对每个上游匿名 `git ls-remote`
          - 漂移 / 不可用 / 契约错误 / `HUFU_DENY_NETWORK=1` 未核对均非零退出
          - 距离槽为 `data_insufficient`，不得写成 `0`
          - 已接入 `.github/workflows/ci.yml`；`pnpm test` 仍零真实上游网络
          - 不自动改已接受基线，不引入 Token / daemon

          路线图索引 [#5](https://github.com/Blicae8917/hufu/issues/5) 保持 OPEN。#26 / #29 仍待人类裁决。
          EOF

          close_if_open 27 /tmp/close-27.md

          gh issue view 27 --repo "${repo}" --json number,state,title
          gh issue view 5 --repo "${repo}" --json number,state,title
          gh issue view 26 --repo "${repo}" --json number,state,title
          gh issue view 29 --repo "${repo}" --json number,state,title
