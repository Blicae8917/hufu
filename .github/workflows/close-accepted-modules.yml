name: close-accepted-modules

# Temporary helper so the Cloud Agent can close Module Issues that the
# sandbox GitHub token cannot write. Do not merge this workflow to main.
on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: close-6-and-7
    if: github.event.pull_request.head.ref == 'cursor/close-accepted-issues-b880'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close accepted Module Issues #6 and #7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          close_if_open() {
            local number="$1"
            local comment_file="$2"
            local state
            state="$(gh issue view "${number}" --repo "${repo}" --json state --jq .state)"
            if [ "${state}" = "CLOSED" ]; then
              echo "#${number} already closed"
              return 0
            fi
            gh issue close "${number}" --repo "${repo}" --reason completed --comment "$(cat "${comment_file}")"
            echo "closed #${number}"
          }

          cat > /tmp/close-6.md <<'EOF'
          ## 验收关闭

          按本 Issue 的必须交付与明确不做核对，**可以关闭**。合入证据：[PR #15](https://github.com/Blicae8917/hufu/pull/15)（已合并入 `main`）。功能合同：`specs/005-zero-copy-decision/`。

          必须交付均已有失败先写、后合入的测试覆盖：

          - 一份 `DECISION_PACKET` 只完整保存一次；同摘要再提幂等；改正文却沿用同一身份则冲突：`tests/decide-packet.test.ts`
          - `EXECUTION_ENVELOPE`、`ROUTE_ACK`、三类 Delta、semantic rebase 护栏：`tests/decide-envelope.test.ts`、`tests/decide-ack.test.ts`、`tests/decide-delta.test.ts`、`tests/decide-guardrail.test.ts`
          - `status` / `handoff` 只传稳定引用、digest 或 Delta，不重写裁决正文：`tests/decide-status-handoff.test.ts`
          - 非空 `added_scope` 只得到 `scope_change_required`，授权范围不变：ack 测试
          - 无 timer / 后台监控；`decide` 不访问 GitHub：guardrail 测试
          - ADR 0005 基数题已落入 `specs/005-zero-copy-decision/research.md`

          明确不做均保持：不写回外部议题、不引入后台监控、不自动回滚、不把 `ROUTE_ACK` 做成审批流。

          本关闭不等于 `0.1.0` 已发布。路线图索引 [#5](https://github.com/Blicae8917/hufu/issues/5) 保持 OPEN。
          EOF

          cat > /tmp/close-7.md <<'EOF'
          ## 验收关闭

          按本 Issue 的必须交付与明确不做核对，**可以关闭**。合入证据：[PR #16](https://github.com/Blicae8917/hufu/pull/16)（已合并入 `main`）。功能合同：`specs/006-deepseek-native-plugin/`。

          必须交付均已有失败先写、后合入的测试覆盖：

          - DeepSeek 原生插件路径：`packages/hufu-dsh` 与 `cordis.patch.yml`（`dsh.bundle.patch`）
          - 真装真卸：隔离 `@deepseek-ai/cordis` 的 `Context.plugin` / `dispose`（`tests/dsh/mount-tools.test.ts`、`tests/dsh/unmount.test.ts`）。已接受规格允许在无 `dsh` 二进制时跳过同一 Bundle 契约的隔离步骤；烟测 skip 不得假绿（`tests/dsh/dsh-cli-smoke.test.ts`）
          - 缺失观测不得写成 `0`：`tests/dsh/missing-observation.test.ts`
          - 声明 `@deepseek-ai/cordis`、不声称兼容上游、不改 Host Agent Loop：`tests/dsh/runtime-identity.test.ts`、`tests/dsh/agent-loop-boundary.test.ts`
          - Standalone 与 DeepSeek 夹具对等：`tests/dsh/view-parity.test.ts` 与 `tests/fixtures/dsh/events.jsonl`

          明确不做均保持：不交付 GitLab 投影、LoopX、会商、网页或出站 Runtime；不把 Host Session Log 当作项目级跨 Session 正本。

          本关闭不等于 `0.1.0` 已发布。路线图索引 [#5](https://github.com/Blicae8917/hufu/issues/5) 保持 OPEN。
          EOF

          close_if_open 6 /tmp/close-6.md
          close_if_open 7 /tmp/close-7.md

          gh issue view 6 --repo "${repo}" --json number,state,title
          gh issue view 7 --repo "${repo}" --json number,state,title
