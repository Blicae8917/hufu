name: close-accepted-modules

# Temporary helper so the Cloud Agent can close Module Issues that the
# sandbox GitHub token cannot write. Do not merge this workflow to main.
on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: close-24
    if: github.event.pull_request.head.ref == 'cursor/close-accepted-issues-b880'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close accepted Issue #24
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"

          close_if_open() {
            local number="$1"
            local comment_file="$2"
            local state
            state="$(gh issue view "${number}" --repo "${repo}" --json state --jq .state)"
            if [ "${state}" = "CLOSED" ]; then
              echo "#${number} already closed"
              return 0
            fi
            gh issue close "${number}" --repo "${repo}" --reason completed --comment "$(cat "${comment_file}")"
            echo "closed #${number}"
          }

          cat > /tmp/close-24.md <<'EOF'
          ## 验收关闭

          按本 Issue 的必须交付与明确不做核对，**可以关闭**。合入证据：[PR #30](https://github.com/Blicae8917/hufu/pull/30)（已合并入 `main`，merge `aac2915`）。

          必须交付均已落地：

          - `CLAUDE.md` 通过 `@AGENTS.md` 导入规则，不复制正文
          - `.specify/scripts/bash/` 六个脚本与 PowerShell 对等；`tests/toolchain.test.ts` 在 Linux 路径干跑 `--json`
          - `.claude/skills/` 指向 `.agents/skills/`，并写明 bash / PowerShell 选择规则
          - `.github/ISSUE_TEMPLATE/` 完整 Module 与简化验收两套骨架
          - `AGENTS.md` 只增补简化验收预读豁免，既有规则条目未改

          明确不做均保持：未删除 `.agents/` / `.specify/`；未移除 PowerShell 脚本；未引入运行时依赖或网络副作用。

          路线图索引 [#5](https://github.com/Blicae8917/hufu/issues/5) 保持 OPEN。
          EOF

          close_if_open 24 /tmp/close-24.md

          gh issue view 24 --repo "${repo}" --json number,state,title
          gh issue view 5 --repo "${repo}" --json number,state,title
